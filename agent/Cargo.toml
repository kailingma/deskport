[package]
name = "deskport-agent"
version = "0.2.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
getrandom = "0.4.3"
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
ureq = { version = "3.5.2", features = ["json"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 4
