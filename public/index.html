<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>deskport</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/vendor/xterm.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="bar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
      <span class="brand-name">deskport</span>
      <span class="host" id="host"></span>
    </div>

    <nav class="tabs" role="tablist" aria-label="View">
      <button class="tab" role="tab" id="tab-screen" aria-controls="view-screen" aria-selected="true" data-view="screen">
        Screen <kbd>1</kbd>
      </button>
      <button class="tab" role="tab" id="tab-term" aria-controls="view-term" aria-selected="false" data-view="term">
        Terminal <kbd>2</kbd>
      </button>
    </nav>

    <div class="actions">
      <span class="status" id="status" data-state="idle"><span class="dot"></span><span class="status-text">Idle</span></span>
      <div class="screen-only">
        <button class="icon-btn" id="btn-paste" title="Send this computer's clipboard to the remote desktop">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="3" width="8" height="4" rx="1"/><path d="M16 5h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2"/></svg>
          <span class="sr">Send clipboard</span>
        </button>
        <button class="icon-btn" id="btn-super" title="Press Super (Activities)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg>
          <span class="sr">Super key</span>
        </button>
        <button class="icon-btn" id="btn-cad" title="Send Ctrl+Alt+Delete">
          <span class="txt">⌃⌥⌦</span>
          <span class="sr">Ctrl Alt Delete</span>
        </button>
      </div>
      <button class="icon-btn" id="btn-full" title="Full screen (captures system keys in Chrome)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        <span class="sr">Full screen</span>
      </button>
    </div>
  </header>

  <main>
    <section class="view" id="view-screen" role="tabpanel" aria-labelledby="tab-screen">
      <div class="display-wrap" id="display-wrap"></div>
      <div class="overlay" id="screen-overlay" hidden>
        <div class="card">
          <p class="card-title" id="screen-overlay-title">Disconnected</p>
          <p class="card-body" id="screen-overlay-body"></p>
          <button class="btn" id="btn-reconnect">Reconnect</button>
        </div>
      </div>
    </section>

    <section class="view" id="view-term" role="tabpanel" aria-labelledby="tab-term" hidden>
      <div class="term-wrap" id="term"></div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
