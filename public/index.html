<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="deskport">
  <title>deskport</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
  <link rel="preload" href="/vendor/inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/vendor/xterm.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body data-view="screen">
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="2.5" y="3.5" width="19" height="13" rx="2"/><path d="M8 20.5h8M12 16.5v4"/></symbol>
    <symbol id="i-terminal" viewBox="0 0 24 24"><path d="m4.5 17 6-5-6-5M12.5 19h7"/></symbol>
    <symbol id="i-clipboard" viewBox="0 0 24 24"><rect x="8" y="2.5" width="8" height="4" rx="1"/><path d="M16 4.5h2a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-13a2 2 0 0 1 2-2h2"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="i-maximize" viewBox="0 0 24 24"><path d="M8 3.5H5.5a2 2 0 0 0-2 2V8M20.5 8V5.5a2 2 0 0 0-2-2H16M16 20.5h2.5a2 2 0 0 0 2-2V16M3.5 16v2.5a2 2 0 0 0 2 2H8"/></symbol>
    <symbol id="i-minimize" viewBox="0 0 24 24"><path d="M8 3.5V6a2 2 0 0 1-2 2H3.5M20.5 8H18a2 2 0 0 1-2-2V3.5M16 20.5V18a2 2 0 0 1 2-2h2.5M3.5 16H6a2 2 0 0 1 2 2v2.5"/></symbol>
    <symbol id="i-keyboard" viewBox="0 0 24 24"><rect x="2.5" y="5.5" width="19" height="13" rx="2"/><path d="M6.5 9.5h.01M10 9.5h.01M13.5 9.5h.01M17 9.5h.01M6.5 13h.01M17 13h.01M10 13h4M7.5 15.5h9"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><path d="M5 12h.01M12 12h.01M19 12h.01"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20.5 12a8.5 8.5 0 1 1-2.5-6M20.5 3.5v5h-5"/></symbol>
    <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 3v8M7 6.3a7.5 7.5 0 1 0 10 0"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
  </svg>

  <header class="bar" id="bar">
    <div class="bar-start">
      <span class="mark" aria-hidden="true"><svg><use href="#i-monitor"/></svg></span>
      <span class="name">deskport</span>
      <span class="host" id="host"></span>
    </div>

    <div class="segmented" role="tablist" aria-label="View">
      <button class="seg" role="tab" data-view="screen" aria-selected="true" aria-controls="view-screen" title="Screen (Alt+1)">
        <svg class="icon"><use href="#i-monitor"/></svg><span>Screen</span>
      </button>
      <button class="seg" role="tab" data-view="term" aria-selected="false" aria-controls="view-term" title="Terminal (Alt+2)">
        <svg class="icon"><use href="#i-terminal"/></svg><span>Terminal</span>
      </button>
    </div>

    <div class="bar-end">
      <span class="badge" id="status" data-state="idle" role="status"><span class="dot"></span><span class="badge-text">Idle</span></span>
      <div class="tools screen-only">
        <button class="btn-icon" data-action="clipboard" title="Send clipboard to the remote desktop" aria-label="Send clipboard">
          <svg class="icon"><use href="#i-clipboard"/></svg>
        </button>
        <button class="btn-icon" data-action="super" title="Press Super (Activities)" aria-label="Press Super">
          <svg class="icon"><use href="#i-grid"/></svg>
        </button>
        <button class="btn-text" data-action="cad" title="Send Ctrl+Alt+Delete">Ctrl+Alt+Del</button>
      </div>
      <span class="divider fs-only-supported" aria-hidden="true"></span>
      <button class="btn-icon fs-only-supported" data-action="fullscreen" title="Full screen" aria-label="Full screen">
        <svg class="icon"><use href="#i-maximize" id="fs-icon"/></svg>
      </button>
    </div>
  </header>
  <button class="bar-handle" id="bar-handle" aria-label="Show toolbar" hidden><span></span></button>

  <main>
    <section class="view" id="view-screen" role="tabpanel">
      <div class="display-wrap" id="display-wrap"></div>
      <div class="overlay" id="screen-overlay" hidden>
        <div class="dialog-card" role="alertdialog" aria-labelledby="screen-overlay-title" aria-describedby="screen-overlay-body">
          <h2 class="dialog-title" id="screen-overlay-title">Disconnected</h2>
          <p class="dialog-body" id="screen-overlay-body"></p>
          <button class="btn-primary" data-action="reconnect">Reconnect</button>
        </div>
      </div>
      <textarea class="ime" id="screen-ime" aria-label="Type on the remote desktop" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
    </section>

    <section class="view" id="view-term" role="tabpanel" hidden>
      <div class="term-wrap" id="term"></div>
    </section>
  </main>

  <div class="keyrow" id="keyrow" role="toolbar" aria-label="Extra keys">
    <button class="key" data-key="esc">Esc</button>
    <button class="key" data-key="tab">Tab</button>
    <button class="key key-mod" data-mod="ctrl" aria-pressed="false">Ctrl</button>
    <button class="key key-mod" data-mod="alt" aria-pressed="false">Alt</button>
    <button class="key" data-key="left" aria-label="Left"><svg class="icon"><use href="#i-left"/></svg></button>
    <button class="key" data-key="up" aria-label="Up"><svg class="icon"><use href="#i-up"/></svg></button>
    <button class="key" data-key="down" aria-label="Down"><svg class="icon"><use href="#i-down"/></svg></button>
    <button class="key" data-key="right" aria-label="Right"><svg class="icon"><use href="#i-right"/></svg></button>
    <button class="key" data-key="/">/</button>
    <button class="key" data-key="-">-</button>
    <button class="key" data-key="|">|</button>
    <button class="key" data-key="~">~</button>
  </div>

  <nav class="tabbar" aria-label="View">
    <button class="tabbar-item" data-view="screen" aria-selected="true">
      <svg class="icon"><use href="#i-monitor"/></svg><span>Screen</span>
    </button>
    <button class="tabbar-item" data-view="term" aria-selected="false">
      <svg class="icon"><use href="#i-terminal"/></svg><span>Terminal</span>
    </button>
    <button class="tabbar-item" data-action="sheet">
      <svg class="icon"><use href="#i-more"/></svg><span>More</span>
    </button>
  </nav>

  <dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
    <div class="sheet-grabber" aria-hidden="true"></div>
    <h2 class="sheet-title" id="sheet-title">Actions</h2>
    <div class="sheet-list">
      <button class="sheet-item" data-action="keyboard"><svg class="icon"><use href="#i-keyboard"/></svg>Show keyboard</button>
      <button class="sheet-item screen-only" data-action="clipboard"><svg class="icon"><use href="#i-clipboard"/></svg>Send clipboard</button>
      <button class="sheet-item screen-only" data-action="super"><svg class="icon"><use href="#i-grid"/></svg>Press Super</button>
      <button class="sheet-item screen-only" data-action="cad"><svg class="icon"><use href="#i-power"/></svg>Send Ctrl+Alt+Delete</button>
      <button class="sheet-item" data-action="reconnect"><svg class="icon"><use href="#i-refresh"/></svg>Reconnect</button>
      <button class="sheet-item fs-only-supported" data-action="fullscreen"><svg class="icon"><use href="#i-maximize"/></svg>Full screen</button>
    </div>
    <button class="sheet-cancel" data-action="close-sheet">Cancel</button>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
